<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-200 via-blue-50 to-gray-500">

<div class="min-h-screen flex items-center justify-center">
    
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
        
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">
            Login
        </h1>

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <!-- Username -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">
                    Username
                </label>
                <input type="text" name="username" placeholder="Enter username"
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none 
                           focus:ring-2 focus:ring-blue-400">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">
                    Password
                </label>
                <input type="password" name="password" placeholder="Enter password"
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none 
                           focus:ring-2 focus:ring-blue-400">
            </div>

            <!-- Error Messages -->
            {% if form.errors %}
            <p class="text-red-500 text-sm">
                Invalid username or password
            </p>
            {% endif %}

            <!-- Button -->
            <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold 
                       hover:bg-blue-700 transition duration-300">
                Login
            </button>
        </form>

        <!-- Register Link -->
        <p class="text-sm text-center text-gray-600 mt-4">
            Don’t have an account? 
            <a href="{% url 'register' %}" class="text-blue-600 hover:underline">
                Register
            </a>
        </p>

    </div>

</div>

</body>
</html>
