<!doctype html>
{% extends 'myapp/base.html'%}
<html class="no-js">
  <!--<![endif]-->
  <html>
    <head>
      <meta charset="utf-8" />
      <meta http-equiv="X-UA-Compatible" content="IE=edge" />
      <title></title>
      <meta name="description" content="" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <link rel="stylesheet" href="" />
    </head>
    <body>
    {% block body %}

<div class="bg-gray-100 min-h-screen py-6 px-3 sm:px-6 lg:px-10">

  <!-- Heading -->
  <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-center text-gray-800 mb-8 sm:mb-10">
"WELCOME TO MY SHOP"
  </h1>

  <!-- Grid -->
  <div class="
    grid 
    gap-6 
    grid-cols-1 
    sm:grid-cols-2 
    md:grid-cols-3 
    lg:grid-cols-4 
    xl:grid-cols-5
  ">
    
    {% for product in products %}
    <div class="bg-white rounded-2xl shadow-md hover:shadow-xl transition duration-300 flex flex-col">
      
      <!-- Image -->
      <div class="h-40 sm:h-44 md:h-48 w-full overflow-hidden">
        <img src="{{product.image.url}}" 
             alt="{{product.name}}" 
             class="w-full h-full object-cover hover:scale-105 transition duration-300" />
      </div>

      <!-- Content -->
      <div class="p-4 sm:p-5 flex flex-col flex-grow">
        
        <a class="text-lg sm:text-xl font-semibold text-gray-800 mb-1" href="{{product.get_absolute_url}}">
          {{product.name}}
        </a>

        <p class="text-green-600 font-bold text-base sm:text-lg mb-2">
          ₹{{product.price}}
        </p>

        <p class="text-gray-600 text-xs sm:text-sm mb-4 line-clamp-3">
          {{product.description}}
        </p>

        <!-- Spacer pushes button down -->
        <div class="mt-auto">
  <a href="{% url 'detail' product.slug %}" 
     class="block w-full text-center bg-blue-600 text-white py-2 text-sm sm:text-base rounded-lg hover:bg-blue-700 transition">
    View Details
  </a>
</div>

      </div>

    </div>
    {% endfor %}

  </div>
</div>

{% endblock %}

      <script src="" async defer></script>
    </body>
  </html>
</html>
